<div class="login-container">
    <div class="login-wrapper">
        <div class="card login-card">
            <div class="card-body">

                <div class="login-header">
                    <div class="logo-circle">
                        <img src="assets/imagen-banco.png" alt="Banco Logo" class="login-logo" width="60" height="60">
                    </div>
                    <h1 class="login-title">Banco</h1>
                    <p class="login-subtitle">Inicia sesión en tu cuenta</p>
                </div>

                <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="login-form">

                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="bi bi-person input-icon"></i>
                            <input type="email" id="username" class="form-control login-input"
                                placeholder="Usuario o correo" required [(ngModel)]="usuario.username" name="username"
                                #emailInput="ngModel">
                        </div>
                        @if(emailInput.invalid && emailInput.touched){
                        <p class="error-message">El usuario es obligatorio</p>
                        }
                    </div>

                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" id="password" class="form-control login-input"
                                placeholder="Contraseña" required [(ngModel)]="usuario.password" name="password"
                                #passwordInput="ngModel">
                        </div>
                        @if(passwordInput.invalid && passwordInput.touched){
                        <p class="error-message">La contraseña es obligatoria</p>
                        }
                    </div>

                    @if(errorMessage) {
                    <p class="error-message login-error">{{ errorMessage }}</p>
                    }

                    <button type="submit" class="btn btn-login" [disabled]="loginForm.invalid || isLoading">
                        @if(isLoading) {
                        <span>Cargando...</span>
                        } @else {
                        <span>Ingresar</span>
                        <i class="bi bi-arrow-right"></i>
                        }
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
